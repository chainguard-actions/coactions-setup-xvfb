---
name: prod
"on":
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Test XVFB
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # v1.6
        with:
          run: echo 'Testing xvfb'
      - name: Test XVFB with working directory
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # v1.6
        with:
          working-directory: ./node_modules
          run: pwd
      - name: Test XVFB with options
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # v1.6
        with:
          options: -screen 0 1600x1200x24
          run: echo 'Testing xvfb'
      - name: Test using major tag
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # v1
        with:
          working-directory: ./node_modules
          options: -screen 0 1600x1200x24
          run: pwd
