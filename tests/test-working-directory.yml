name: Test xvfb with working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install xvfb
        run: |
          apt-get update -qq && apt-get install -y xvfb || true
          which Xvfb || (echo "Xvfb not found, trying alternative install" && apt-get install -y xvfb)
      - name: Create test directory and file
        run: |
          mkdir -p /tmp/xvfb-test-dir
          echo "test-content" > /tmp/xvfb-test-dir/marker.txt
      - id: action
        uses: .
        with:
          run: cat marker.txt
          working-directory: /tmp/xvfb-test-dir
      - name: Assert action succeeded with working directory
        run: |
          echo "Action completed successfully with working-directory"
          echo "PASS"
