name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test directory and marker file
        run: |
          mkdir -p /tmp/xvfb-test-dir
          echo "marker" > /tmp/xvfb-test-dir/marker.txt
      - name: Install xvfb
        run: |
          apt-get update -qq && apt-get install -y -qq xvfb || true
      - id: action
        uses: .
        with:
          run: test -f marker.txt && echo "working-directory test passed"
          working-directory: /tmp/xvfb-test-dir
      - name: Assert action completed successfully
        run: |
          echo "PASS: action ran successfully with working-directory input"
