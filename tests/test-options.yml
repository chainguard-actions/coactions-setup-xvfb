name: Test xvfb with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install xvfb
        run: |
          apt-get update -qq && apt-get install -y xvfb || true
          which Xvfb || (echo "Xvfb not found, trying alternative install" && apt-get install -y xvfb)
      - id: action
        uses: .
        with:
          run: echo "running with custom xvfb options"
          options: "-screen 0 1280x1024x24"
      - name: Assert action succeeded with custom options
        run: |
          echo "Action completed successfully with custom xvfb options"
          echo "PASS"
